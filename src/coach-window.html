<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'"><title>Opening Lens Coach</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="coach-window.css"></head>
<body><main class="coach-window">
  <header><div class="eyebrow">OPENING LENS</div><h1>Coach</h1><p id="coach-opening">Waiting for a study</p></header>
  <p id="overlap-warning" role="status" hidden></p>
  <article id="current"><p id="coach-message" role="status" aria-live="polite">Coach: Waiting for a move.</p></article>
  <section id="switch-variation" hidden><strong id="switch-title">Switch to a known variation</strong><p id="switch-hint" class="hint"></p><div id="switch-options"></div></section>
  <label class="check"><input id="read-aloud" type="checkbox"> Read guidance aloud</label>
</main><script src="coach-window.js"></script></body></html>
